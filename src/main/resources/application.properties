spring.application.name=projectCom

server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5430/projectCom
spring.datasource.username=usr
spring.datasource.password=pwd
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true

spring.flyway.password=pwd
spring.flyway.user=usr
spring.flyway.url=jdbc:postgresql://localhost:5430/projectCom
spring.flyway.locations=classpath:db/migration


logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.data.jdbc.core.JdbcAggregateTemplate=DEBUG


serial.port-name=COM3
serial.baud-rate=9600
serial.data-bits=8
serial.parity=0
serial.stop-bits=1
serial.read-timeout=2000
serial.write-timeout=0
