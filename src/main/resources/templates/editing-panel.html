<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Настройка выходов панели</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-dark: #0069d9;
      --border: #dee2e6;
      --bg-soft: #f8f9fa;
      --danger: #dc3545;
    }
    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
      color: #212529;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      background: var(--bg-soft);
    }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .panel-name { font-weight: bold; }

.outputs-table { border-collapse: collapse; width: 100%; }
.outputs-table th, .outputs-table td {
  border: 1px solid var(--border);
  padding: 10px 6px;
  text-align: center;
}
.outputs-table thead th {
  background: #f0f0f0;
  font-size: 12px;
  color: #495057;
}
.byte-label {
  background: #f0f0f0;
  font-weight: bold;
  white-space: nowrap;
  color: #495057;
}
.bit-col { width: 11%; }          /* 8 бит + колонка "Байт" ≈ поровну */
.byte-col { width: 12%; }

.bit-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
  font-size: 12px;
}
.bit-cell input[type="checkbox"] {
  accent-color: var(--primary);
  width: 15px;
  height: 15px;
  cursor: pointer;
}
.bit-cell:hover { color: var(--primary-dark); }


    .hint { color: #6c757d; font-size: 13px; margin-top: 12px; }
    .error {
      color: var(--danger);
      padding: 12px;
      background: #ffe6e6;
      border-radius: 6px;
    }
    .taken { opacity: 0.45; }
    .btn-save {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover { background: var(--primary-dark); }
  </style>
</head>
<body>

<div class="card">
  <h2 th:text="${pageTitle}"></h2>
  <p>Панель: <span th:text="${panel.nameElement.displayName}"></span></p>
  <div th:class="${portStatus.startsWith('Передано') ? 'status-delivered' :
                   (portStatus.startsWith('Не передано') ? 'status-failed' : 'status-waiting')}">
    <span th:text="${portStatus}"></span>
  </div>
</div>

<form th:action="@{/panels/{id}/edit/save(id=${panel.id})}" method="post">
  <div class="card" th:if="${not #lists.isEmpty(outputGroups)}">
    <table class="outputs-table">
      <thead>
      <tr>
        <th class="byte-col">Байт</th>
        <th th:each="i : ${#numbers.sequence(0, 7)}" class="bit-col">
          бит <span th:text="${i}"></span>
        </th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="entry : ${outputGroups}">
        <td class="byte-label">
          <span th:text="${entry.key} + '-й'">1-й</span>
        </td>
        <td th:each="i : ${#numbers.sequence(0, 7)}">
          <th:block th:if="${entry.value[i] != null}" th:with="opt=${entry.value[i]}">
            <label class="bit-cell"
                   th:classappend="${takenByOthers.contains(opt)} ? ' taken'">
              <input type="checkbox"
                     name="outputs"
                     th:value="${opt.name()}"
                     th:checked="${selected.contains(opt)}"
                     th:disabled="${takenByOthers.contains(opt)}"
                     th:title="'Маска: 0x' + ${opt.maskHex()}" />
              <span th:text="${opt.displayName}"></span>
            </label>
          </th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <p th:if="${#lists.isEmpty(outputGroups)}" class="error">
    Список выходов пуст — проверьте настройки панели.
  </p>

  <div th:if="${panel.nameElement.name() == 'PANEL_SYNCHRONIZATION'}">
    <label>Период (делитель)</label>
    <input type="number" name="period" th:value="${currentDivisor}" min="1" />
  </div>

  <button type="submit" class="btn btn-primary">Сохранить</button>
</form>

</body>
</html>
