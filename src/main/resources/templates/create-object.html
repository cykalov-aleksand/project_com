<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать ячейку</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { display: inline-block; margin-top: 15px; color: #555; text-decoration: none; }
    </style>
</head>
<body>
<h1 th:text="${objectDto != null ? 'Редактирование ячейки' : 'Создание новой ячейки'}">Создание новой ячейки</h1>

<form th:action="@{/save}" th:object="${objectDto}" method="post">
    <!-- Скрытое поле с id -->
    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="name">Название ячейки:</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Введите название" required />
    </div>

    <button type="submit">
        <span th:if="${objectDto != null and objectDto.id != null}">Обновить</span>
        <span th:unless="${objectDto != null and objectDto.id != null}">Создать</span>
    </button>
</form>

<a href="/">Вернуться к списку</a>
</body>
</html>
