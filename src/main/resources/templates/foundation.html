<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список ячеек</title>
    <style>
        .data-table { border-collapse: collapse; font-family: Arial, sans-serif; width: 100%; }
        .data-table th, .data-table td { border: 1px solid #ccc; padding: 8px; }
        .data-table th { background-color: #f0f0f0; text-align: left; }
        .btn-create { padding: 10px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .action-link { color: #007bff; text-decoration: none; margin-right: 12px; }
        .btn-delete {
            background: none;
            border: none;
            color: red;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin: 0;
        }
        .btn-delete:hover { color: darkred; }
    </style>
</head>
<body>
<h1>Список ячеек</h1>

<table class="data-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название ячейки</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(listElement)}">
        <td colspan="3" style="text-align: center; padding: 16px;">Список ячеек пуст</td>
    </tr>

    <tr th:each="elem : ${listElement}">
        <td th:text="${elem.id}"></td>
        <td th:text="${elem.name}"></td>
        <td>
          <a th:href="@{/edit/{id}(id=${elem.id})}" class="action-link">Редактировать</a>

                     <form th:action="@{/delete/{id}(id=${elem.id})}" method="post" style="display:inline;">
                   <button type="submit" class="btn-delete">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a href="/create" class="btn-create">Создать новый элемент</a>
</body>
</html>
