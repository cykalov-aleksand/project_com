version: '3.8'

services:
  db:
    image: postgres:17
    container_name: pg-docker
    environment:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: projectCom
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d projectCom"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  db-test:
    image: postgres:17
    container_name: pg-docker-test
    environment:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: projectCom_test
    ports:
      - "5431:5432"
    volumes:
      - ./pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U usr -d projectCom_test" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
